<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workshop Check-In | SPIN Project</title>
  <meta name="description" content="Staff check-in page for the SPIN Project Regional Workshop." />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/spin_logo.jpeg" />
  <link rel="shortcut icon" href="images/spin_logo.jpeg" type="image/jpeg" />

  <!-- External stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <!-- Workshop Configuration -->
  <script src="js/workshop-config.js"></script>

  <!-- QR Code Scanner Library -->

  <style>
    body { font-family: 'Inter', sans-serif; }
    #qr-reader { border: none !important; border-radius: 12px; overflow: hidden; }
    #qr-reader video { border-radius: 12px; }
    #qr-reader__scan_region { min-height: 250px; }
    #qr-reader__dashboard { display: none !important; }
    .scan-overlay { position: absolute; inset: 0; pointer-events: none; }
    .scan-line {
      position: absolute; left: 10%; right: 10%; height: 3px;
      background: linear-gradient(90deg, transparent, #008C5A, transparent);
      animation: scan 2s ease-in-out infinite;
    }
    @keyframes scan {
      0%, 100% { top: 20%; }
      50% { top: 80%; }
    }
    .mode-btn { transition: all 0.2s; }
    .mode-btn.active { background: #008C5A !important; color: white !important; border-color: #008C5A !important; }
    .result-card { animation: slideUp 0.3s ease-out; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fade-in { animation: fadeIn 0.3s ease-out; }
  </style>
</head>
<body class="antialiased font-sans text-gray-900 bg-gray-100 min-h-screen flex flex-col">

  <!-- Top Bar -->
  <div class="bg-white shadow-sm border-b border-gray-100">
    <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-10 xl:px-16 py-2.5 flex items-center justify-between gap-4 text-sm">
      <a href="/" class="flex items-center gap-3 rounded focus:outline-none focus:ring-2 focus:ring-[#aaff33]">
        <img src="images/spin_logo.jpeg" alt="SPIN Project Logo" class="h-14 w-auto" />
      </a>
      <div class="flex items-center gap-3">
        <span class="text-xs text-gray-500 hidden sm:inline">Workshop Check-In</span>
        <a href="/workshop-registration.html" class="text-xs text-[#008C5A] font-semibold hover:underline hidden sm:inline">Registration Page</a>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-[#008C5A] shadow">
    <div class="max-w-screen-2xl mx-auto px-4 sm:px-6 lg:px-10 xl:px-16 h-14 flex items-center justify-between">
      <span class="text-white/80 text-sm font-medium tracking-wide">Staff Check-In Station</span>
      <div id="stats-bar" class="flex items-center gap-4 text-sm">
        <span class="text-white/70">Checked in: <strong id="stat-checked" class="text-white">—</strong></span>
        <span class="text-white/70">Total: <strong id="stat-total" class="text-white">—</strong></span>
      </div>
    </div>
  </header>

  <!-- Mode Toggle -->
  <div class="bg-white border-b border-gray-200 sticky top-0 z-40">
    <div class="max-w-2xl mx-auto px-4 py-3 flex gap-3">
      <button id="mode-scanner" class="mode-btn active flex-1 py-2.5 px-4 rounded-lg border-2 border-gray-200 text-sm font-semibold text-gray-600 bg-white hover:border-[#008C5A] transition-colors">
        <span class="flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
          Scan QR Code
        </span>
      </button>
      <button id="mode-manual" class="mode-btn flex-1 py-2.5 px-4 rounded-lg border-2 border-gray-200 text-sm font-semibold text-gray-600 bg-white hover:border-[#008C5A] transition-colors">
        <span class="flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          Search Name
        </span>
      </button>
    </div>
  </div>

  <!-- Main Content -->
  <main class="flex-1 py-6">
    <div class="max-w-2xl mx-auto px-4">

      <!-- Scanner Mode -->
      <div id="scanner-section">
        <!-- Camera Toggle -->
        <div class="flex justify-center mb-4">
          <button id="camera-toggle" class="text-sm text-[#008C5A] font-semibold flex items-center gap-2 bg-white px-4 py-2 rounded-full shadow hover:shadow-md transition-shadow">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            <span id="camera-label">Switch to Front Camera</span>
          </button>
        </div>

        <!-- QR Reader Container -->
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden relative">
          <div id="qr-reader" class="w-full"></div>
          <div class="scan-overlay">
            <div class="scan-line"></div>
          </div>
          <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/50 to-transparent p-4 text-center">
            <p class="text-white text-sm font-medium">Point camera at the participant's QR code</p>
          </div>
        </div>

        <!-- Scanner Status -->
        <p id="scanner-status" class="text-center text-sm text-gray-500 mt-3">Initializing camera...</p>
      </div>

      <!-- Manual Search Mode (hidden by default) -->
      <div id="manual-section" class="hidden">
        <div class="bg-white rounded-2xl shadow-lg p-6">
          <label for="search-input" class="block text-sm font-semibold text-gray-700 mb-2">Search by Name, Email, or Registration ID</label>
          <div class="flex gap-3">
            <input
              id="search-input"
              type="text"
              placeholder="Type to search..."
              class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#008C5A] focus:border-[#008C5A] transition-colors text-base"
            />
            <button id="search-btn" class="bg-[#008C5A] text-white font-semibold px-6 py-3 rounded-lg hover:bg-[#006b44] transition-colors">
              Search
            </button>
          </div>

          <!-- Search Results -->
          <div id="search-results" class="mt-4 space-y-3">
            <p id="search-empty" class="hidden text-center text-gray-500 text-sm py-4">No results found. Try a different search term.</p>
            <p id="search-loading" class="hidden text-center text-[#008C5A] text-sm py-4">Searching...</p>
          </div>
        </div>
      </div>

      <!-- Result Overlay (shown after successful/failed check-in) -->
      <div id="result-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(0,0,0,0.5);">
        <div id="result-card" class="result-card bg-white rounded-2xl shadow-2xl max-w-sm w-full p-8 text-center">
          <!-- Success content (dynamically filled) -->
        </div>
      </div>

    </div>
  </main>

  </audio>

  <!-- Footer -->
  <footer class="bg-[#1a1a1a] text-white py-4 mt-auto">
    <div class="max-w-screen-2xl mx-auto px-4 text-center">
      <p class="text-gray-400 text-xs">&copy; 2026 SPIN Project. Developed by <a href="https://es2.com.ng" target="_blank" class="text-[#aaff33] hover:underline">ES2 LIMITED</a></p>

  </footer>

  <!-- JS -->
  <script>
    const API_URL = window.SPIN_WORKSHOP_CONFIG?.API_URL || 'YOUR_APPS_SCRIPT_WEB_APP_URL';
    let html5QrCode = null;
    let currentCamera = 'environment';
    let isScanning = false;

    // ── MODE TOGGLE ──────────────────────────────────────────
    const modeScanner = document.getElementById('mode-scanner');
    const modeManual = document.getElementById('mode-manual');
    const scannerSection = document.getElementById('scanner-section');
    const manualSection = document.getElementById('manual-section');

    modeScanner.addEventListener('click', () => {
      modeScanner.classList.add('active');
      modeManual.classList.remove('active');
      scannerSection.classList.remove('hidden');
      manualSection.classList.add('hidden');
      startScanner();
    });

    modeManual.addEventListener('click', () => {
      modeManual.classList.add('active');
      modeScanner.classList.remove('active');
      manualSection.classList.remove('hidden');
      scannerSection.classList.add('hidden');
      stopScanner();
      document.getElementById('search-input').focus();
    });

    // ── QR SCANNER ───────────────────────────────────────────

    function startScanner() {
      if (html5QrCode && isScanning) return;

      html5QrCode = new Html5Qrcode('qr-reader');
      isScanning = true;

      document.getElementById('scanner-status').textContent = 'Initializing camera...';

      html5QrCode.start(
        { facingMode: currentCamera },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          aspectRatio: 1.0
        },
        onScanSuccess,
        () => {}
      ).then(() => {
        document.getElementById('scanner-status').textContent = 'Camera ready — scan QR codes';
      }).catch(err => {
        console.error('Camera error:', err);
        document.getElementById('scanner-status').textContent = 'Camera access denied. Please allow camera permission and refresh.';
        isScanning = false;
      });
    }

    function stopScanner() {
      if (html5QrCode && isScanning) {
        html5QrCode.stop().then(() => {
          isScanning = false;
        }).catch(() => {
          isScanning = false;
        });
      }
    }

    function onScanSuccess(decodedText) {
      // Vibrate on scan (mobile)
      if (navigator.vibrate) navigator.vibrate(200);

      // Pause scanning while processing
      if (html5QrCode && isScanning) {
        html5QrCode.pause(true);
      }

      processCheckin(decodedText.trim(), 'QR Scan');
    }

    // Camera toggle
    document.getElementById('camera-toggle').addEventListener('click', () => {
      currentCamera = currentCamera === 'environment' ? 'user' : 'environment';
      document.getElementById('camera-label').textContent =
        currentCamera === 'environment' ? 'Switch to Front Camera' : 'Switch to Back Camera';

      if (isScanning) {
        html5QrCode.stop().then(() => {
          isScanning = false;
          startScanner();
        }).catch(() => {
          isScanning = false;
          startScanner();
        });
      }
    });

    // ── MANUAL SEARCH ────────────────────────────────────────

    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const searchResults = document.getElementById('search-results');
    const searchEmpty = document.getElementById('search-empty');
    const searchLoading = document.getElementById('search-loading');

    async function performSearch() {
      const query = searchInput.value.trim();
      if (!query) return;

      searchLoading.classList.remove('hidden');
      searchEmpty.classList.add('hidden');
      searchResults.innerHTML = '';
      searchResults.appendChild(searchLoading);
      searchResults.appendChild(searchEmpty);

      try {
        const searchUrl = API_URL + '?' + new URLSearchParams({ action: 'checkin_manual', query }).toString();
        const response = await fetch(searchUrl);
        const result = await response.json();
        searchLoading.classList.add('hidden');

        if (result.success && result.results.length > 0) {
          result.results.forEach(r => {
            const card = document.createElement('div');
            card.className = 'bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between hover:border-[#008C5A] transition-colors';

            const statusBadge = r.checkedIn
              ? '<span class="text-xs font-semibold text-green-700 bg-green-100 px-2 py-1 rounded-full">Checked In</span>'
              : '';

            card.innerHTML = `
              <div class="flex-1 min-w-0">
                <p class="font-semibold text-gray-900 truncate">${r.fullName}</p>
                <p class="text-sm text-gray-500 truncate">${r.organization}</p>
                <p class="text-xs text-gray-400 mt-1">${r.registrationId}</p>
                ${statusBadge}
              </div>
              ${!r.checkedIn ? '<button class="checkin-btn ml-4 bg-[#008C5A] text-white text-sm font-semibold px-4 py-2 rounded-lg hover:bg-[#006b44] transition-colors whitespace-nowrap">Check In</button>' : ''}
            `;

            if (!r.checkedIn) {
              card.querySelector('.checkin-btn').addEventListener('click', () => {
                processCheckin(r.registrationId, 'Manual');
              });
            }

            searchResults.appendChild(card);
          });
        } else {
          searchEmpty.classList.remove('hidden');
          searchResults.appendChild(searchEmpty);
        }
      } catch (err) {
        searchLoading.classList.add('hidden');
        searchEmpty.textContent = 'Search failed. Please try again.';
        searchEmpty.classList.remove('hidden');
        searchResults.appendChild(searchEmpty);
      }
    }

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') performSearch();
    });

    // ── CHECK-IN PROCESSING ──────────────────────────────────

    let lastCheckinTime = 0;

    async function processCheckin(registrationId, method) {
      // Debounce: prevent rapid double-scans
      const now = Date.now();
      if (now - lastCheckinTime < 3000) return;
      lastCheckinTime = now;

      try {
        const checkinAction = method === 'QR Scan' ? 'checkin_qr' : 'checkin_confirm';
        const checkinUrl = API_URL + '?' + new URLSearchParams({ action: checkinAction, registrationId }).toString();
        const response = await fetch(checkinUrl);
        const result = await response.json();

        if (result.success) {
          playBeep();
          showResult(true, {
            name: result.name,
            designation: result.designation,
            organization: result.organization,
            checkinTime: result.checkinTime,
            method: method
          });
          loadStats();
        } else if (result.alreadyCheckedIn) {
          showResult(false, {
            name: result.name,
            message: 'Already checked in',
            checkinTime: result.checkinTime
          });
        } else {
          showResult(false, { message: result.message || 'Check-in failed' });
        }
      } catch (err) {
        showResult(false, { message: 'Network error. Please try again.' });
      }

      // Resume scanning after 2.5s
      if (method === 'QR Scan' && html5QrCode) {
        setTimeout(() => {
          if (isScanning) {
            html5QrCode.resume();
          }
        }, 2500);
      }
    }

    // ── RESULT OVERLAY ───────────────────────────────────────

    function showResult(success, data) {
      const overlay = document.getElementById('result-overlay');
      const card = document.getElementById('result-card');

      if (success) {
        card.innerHTML = `
          <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <h3 class="text-xl font-bold text-gray-900 mb-1">Checked In!</h3>
          <p class="text-gray-600 mb-3">${data.name}</p>
          ${data.designation ? '<p class="text-sm text-gray-500 mb-1">' + data.designation + '</p>' : ''}
          ${data.organization ? '<p class="text-sm text-gray-500 mb-3">' + data.organization + '</p>' : ''}
          <p class="text-xs text-gray-400">${data.method} at ${data.checkinTime}</p>
        `;
      } else {
        const isAlready = data.message === 'Already checked in';
        card.innerHTML = `
          <div class="w-20 h-20 ${isAlready ? 'bg-yellow-100' : 'bg-red-100'} rounded-full flex items-center justify-center mx-auto mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 ${isAlready ? 'text-yellow-600' : 'text-red-600'}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              ${isAlready
                ? '<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z" />'
                : '<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />'
              }
            </svg>
          </div>
          <h3 class="text-xl font-bold text-gray-900 mb-2">${isAlready ? 'Already Checked In' : 'Not Found'}</h3>
          ${data.name ? '<p class="text-gray-600 mb-1">' + data.name + '</p>' : ''}
          <p class="text-sm text-gray-500">${isAlready ? 'This person was checked in at ' + data.checkinTime : data.message}</p>
        `;
      }

      overlay.classList.remove('hidden');

      // Auto-dismiss after 2s
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 2000);

      // Tap to dismiss
      overlay.addEventListener('click', function handler() {
        overlay.classList.add('hidden');
        overlay.removeEventListener('click', handler);
      });
    }

    // ── AUDIO FEEDBACK ───────────────────────────────────────

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.value = 0.3;
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    // ── STATS ────────────────────────────────────────────────

    async function loadStats() {
      try {
        const response = await fetch(API_URL + '?action=checkin_stats');
        const result = await response.json();
        if (result.success) {
          document.getElementById('stat-checked').textContent = result.checkedIn;
          document.getElementById('stat-total').textContent = result.total;
        }
      } catch (e) {}
    }

    // ── INIT ─────────────────────────────────────────────────

    loadStats();
    startScanner();
  </script>

</body>
